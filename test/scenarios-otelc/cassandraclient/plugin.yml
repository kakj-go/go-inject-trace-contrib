service: cassandraclient
entry: /health
health: /health
port: 8080
dependencies:
  cassandra-server:
    image: cassandra:4.1.3
    hostname: cassandra-server
    healthcheck:
      test:
      - CMD-SHELL
      - cqlsh -e 'describe keyspaces' >/dev/null 2>&1
      interval: 10s
      timeout: 15s
      retries: 60
support-version:
  - go: "1.26"
    framework: [v2.0.0]
