entry: /execute
health: /health
port: '8080'
env: {}
dependencies:
  mqnamesrv:
    image: apache/rocketmq:5.3.2
    hostname: mqnamesrv
    ports:
    - 9876
    command:
    - sh
    - mqnamesrv
  mqbroker:
    image: apache/rocketmq:5.3.2
    hostname: mqbroker
    depends_on:
    - mqnamesrv
    ports:
    - 10909
    - 10911
    - 10912
    volumes:
    - ./config/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    command:
    - sh
    - mqbroker
    - autoCreateTopicEnable=true
    environment:
      NAMESRV_ADDR: mqnamesrv:9876
support-version:
- go: '1.25'
  framework:
  - v2.1.2
