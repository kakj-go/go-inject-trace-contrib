entry: /execute
health: /health
port: '8080'
env: {}
dependencies:
  amqp-server:
    image: rabbitmq:3.11.14-management
    hostname: amqp-server
    ports:
    - '5672'
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: '123456'
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 5s
      timeout: 60s
      retries: 120
support-version:
- go: '1.25'
  framework:
  - v1.9.0
