entry: /execute
health: /health
port: '8080'
env:
  SW_AGENT_PLUGIN_CONFIG_REDIS_MAX_ARGS_BYTES: '1024'
dependencies:
  redis-server:
    image: redis:6.2
    hostname: redis-server
    expose:
    - '6379'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -h
      - localhost
      - ping
      interval: 5s
      timeout: 60s
      retries: 120
support-version:
- go: '1.25'
  framework:
  - v9.0.4
  - v9.0.5
