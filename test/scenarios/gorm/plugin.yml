entry: /execute
health: /health
port: '8080'
env:
  SW_AGENT_PLUGIN_CONFIG_GORM_COLLECT_PARAMETER: 'true'
dependencies:
  mysql-server:
    image: mysql:5.7
    hostname: mysql-server
    expose:
    - '3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      interval: 5s
      timeout: 60s
      retries: 120
support-version:
- go: '1.25'
  framework:
  - v1.22.0
  - v1.23.0
  - v1.24.0
  - v1.24.1
  - v1.24.2
  - v1.24.3
  - v1.24.4
  - v1.24.5
  - v1.25.0
  - v1.25.1
- go: '1.25'
  framework:
  - v1.25.10
  excepted-file: config/excepted-gorm-v1.25.10.yml
