entry: /execute
health: /health
port: '8080'
env:
  SW_AGENT_PLUGIN_CONFIG_SQL_COLLECT_PARAMETER: 'true'
dependencies:
  postgres:
    image: postgres:15-alpine
    hostname: postgres-server
    expose:
    - '5432'
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U user -d database
      interval: 5s
      timeout: 60s
      retries: 120
support-version:
- go: '1.25'
  framework:
  - v5.5.5
- go: '1.25'
  framework:
  - v5.6.0
- go: '1.25'
  framework:
  - v5.7.2
