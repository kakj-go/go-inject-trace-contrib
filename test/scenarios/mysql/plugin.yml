entry: /execute
health: /health
port: '8080'
env:
  SW_AGENT_PLUGIN_CONFIG_SQL_COLLECT_PARAMETER: 'true'
dependencies:
  mysql:
    image: mysql:5.7
    hostname: mysql-server
    expose:
    - '3306'
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: database
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - localhost
      interval: 5s
      timeout: 60s
      retries: 120
support-version:
- go: '1.25'
  framework:
  - v1.4.0
  - v1.4.1
  - v1.5.0
  - v1.6.0
  - v1.7.1
